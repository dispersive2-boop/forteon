name: CI

# Гоняем на каждом push и на каждый PR. Задача — не «позеленить бейдж»,
# а поймать поломку до мержа: тесты бэкенда на изолированной БД
# и проверку типов фронтенда.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Отменяем предыдущий прогон для той же ветки — не ждём очередь впустую.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      # conftest.py выставляет свои значения, но явно фиксируем окружение,
      # чтобы тест никогда не мог дотянуться до боевой БД.
      FORTEON_ENV: test
      FORTEON_DEBUG: "1"
      FORTEON_SECRET_KEY: ci-only-not-a-secret
      FORTEON_DATABASE_URL: sqlite:////tmp/forteon_ci.db
      FORTEON_AI_ENABLED: "false"
      FORTEON_NOTE_WATCHER: "false"
      FORTEON_DEMO_SEED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка, что тесты не смотрят в боевую БД
        run: |
          python - <<'PY'
          from app.config import settings
          assert settings.database_url.startswith("sqlite"), settings.database_url
          assert "forteon" in settings.database_url, settings.database_url
          print("ok:", settings.database_url)
          PY

      - name: pytest
        run: python -m pytest tests -q --maxfail=1

  frontend:
    name: Frontend · tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

  secrets:
    name: Hygiene · нет секретов и данных
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth: 0 обязателен. По умолчанию checkout делает shallow-клон
      # глубиной 1, и базового коммита PR в истории нет — тогда git rev-list
      # падает с "Invalid revision range", хотя с коммитами всё в порядке.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Запрещённые файлы в индексе
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(\.env$|\.env\.local$|node_modules/)|\.(db|sqlite3|db-wal|db-shm)$|^backend/_backup/' || true)
          if [ -n "$bad" ]; then
            echo "В репозиторий попали секреты или данные:"
            echo "$bad"
            exit 1
          fi
          echo "Чисто."

      - name: Коммиты по Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Берём только добавленные в PR коммиты. Если sha недоступен
          # (форк без прав), проверяем хотя бы комментарий слияния.
          if ! commits=$(git rev-list "$BASE_SHA..$HEAD_SHA" 2>/dev/null); then
            echo "Не удалось получить список коммитов ($BASE_SHA..$HEAD_SHA), пропускаю проверку."
            exit 0
          fi
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            # Разрешаем необязательный префикс PR-мержа/вложенности.
            case "$subject" in
              feat*|fix*|docs*|chore*|refactor*|test*|perf*|build*|ci*|style*|Merge*|Revert*|baseline*|release*|initial*) ;;
              *) echo "Не по шаблону: $sha $subject"; fail=1 ;;
            esac
          done <<< "$commits"
          exit $fail
